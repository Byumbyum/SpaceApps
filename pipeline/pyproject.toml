[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dalton-permafrost-pipeline"
version = "0.1.0"
description = "Offline, provenance-first processing for the Dalton corridor ground-motion app"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "xarray>=2024.1",
  "h5py>=3.10",
  "rasterio>=1.3",
  "pyproj>=3.6",
  "shapely>=2.0",
  "geopandas>=0.14"
]

[project.optional-dependencies]
download = ["asf_search>=7.0", "earthaccess>=0.10", "cdsapi>=0.7"]
test = ["pytest>=8.0"]

[project.scripts]
dalton-pipeline = "permafrost_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["permafrost_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
